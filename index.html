<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102942">
<title>SR দোকান ম্যাপ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:system-ui,'Noto Sans Bengali',sans-serif;color:#17283d}*{box-sizing:border-box}body{margin:0;background:#edf2f7}button,input{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:default}.btn{border-radius:10px;padding:11px 15px;font-weight:700;background:#eaf2fb;color:#145888}.btn.primary{background:#1976d2;color:white}.btn.danger{color:#bd3434;background:#fff0f0}.icon{width:45px;height:45px;border-radius:12px;background:white;box-shadow:0 2px 12px #10294230;color:#193f64;font-size:22px;display:grid;place-items:center}.screen{display:none}.screen.active{display:block}.homeHead{background:#102942;color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px}.homeHead h1{font-size:20px;margin:0}.home{padding:20px;max-width:1100px;margin:auto}.home h2{font-size:20px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{background:white;border:1px solid #dae4ee;border-radius:16px;padding:20px;box-shadow:0 5px 20px #13324e0b}.card>button:first-child{display:block;background:transparent;text-align:left;width:100%;padding:0;color:inherit;font-size:21px;font-weight:750}.card small{color:#64778b;display:block;margin:9px 0 14px}.cardActions{display:flex;gap:8px}.cardActions button{flex:1}.empty{color:#687a8d}.mapScreen{position:relative;height:100dvh;overflow:hidden}#map{width:100%;height:100%}.mapTop{position:absolute;z-index:800;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;gap:9px;pointer-events:none}.mapTop>*{pointer-events:auto}.mapTitle{background:white;border-radius:12px;padding:10px 13px;box-shadow:0 2px 12px #10294230;min-height:45px;flex:1;max-width:340px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mapRight{margin-left:auto;display:grid;gap:8px}.mapBottom{position:absolute;z-index:800;bottom:25px;left:12px;display:flex;gap:8px}.mapBottom button{box-shadow:0 2px 12px #10294230}.mapNotice{position:absolute;z-index:805;top:75px;left:50%;transform:translateX(-50%);background:white;border-radius:10px;padding:9px 12px;box-shadow:0 2px 12px #10294230;max-width:85%;text-align:center;pointer-events:none}.mapNotice:empty{display:none}.shopLabel{background:#fff;border:1px solid #c7d7e4;border-radius:8px;padding:4px 7px;box-shadow:0 2px 8px #0003;white-space:nowrap;font-size:13px;font-weight:700;max-width:155px;overflow:hidden;text-overflow:ellipsis}.labelIcon{background:none;border:0}.leaflet-div-icon{background:none;border:0}.leaflet-popup-content{font-size:15px}.leaflet-popup-content button{background:#1976d2;color:white;padding:8px 12px;border-radius:8px;margin-top:8px}.drawOverlay{display:none;position:absolute;inset:0;z-index:790;touch-action:none;cursor:crosshair}.drawOverlay.active{display:block}.drawActions{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);z-index:810;display:none;gap:8px;background:white;padding:8px;border-radius:12px;box-shadow:0 2px 15px #0004}.drawActions.active{display:flex}.drawActions button{white-space:nowrap}.sheet{position:absolute;z-index:850;bottom:0;left:0;right:0;background:white;border-radius:20px 20px 0 0;box-shadow:0 -7px 25px #0b264338;padding:14px 18px max(18px,env(safe-area-inset-bottom));max-height:63dvh;overflow:auto}.sheet[hidden]{display:none}.sheetHeader{display:flex;align-items:flex-start;gap:12px}.sheetHeader h2{margin:3px 0 5px;font-size:21px}.sheetHeader p{margin:0;color:#5c7185}.sheetHeader .icon{margin-left:auto;box-shadow:none;background:#edf2f7;flex:none}.shopImage{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:11px 0}.sheetButtons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.sheetButtons button{flex:1;min-width:120px}.listPage{max-width:850px;margin:auto;padding:16px}.listHead{display:flex;align-items:center;gap:12px}.listHead h2{flex:1}.listItem{background:white;border:1px solid #dae4ee;border-radius:13px;padding:12px;display:flex;gap:12px;margin:10px 0;align-items:center}.listItem img{width:72px;height:72px;object-fit:cover;border-radius:9px}.listItem strong{display:block}.listItem small{display:block;color:#607487;margin:5px 0}.listItem .btn{margin-left:auto}.modal{border:0;border-radius:16px;width:min(460px,calc(100vw - 24px));padding:23px;box-shadow:0 15px 55px #0005}.modal::backdrop{background:#10294299}.modal h2{margin:0 0 14px}.modal label{display:block;font-weight:700;margin:13px 0 5px}.modal input{width:100%;border:1px solid #b8cadd;border-radius:9px;padding:11px}.modal footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.modal p{color:#617487;line-height:1.5}.leaflet-control-attribution{font-size:11px}@media(max-width:600px){.homeHead{padding:14px}.homeHead h1{font-size:17px}.mapTitle{max-width:calc(100vw - 170px)}.mapBottom{bottom:20px}.leaflet-control-zoom{margin-top:75px!important}.sheetButtons button{min-width:105px}}
</style>
</head>
<body>
<section id="homeScreen" class="screen active"><header class="homeHead"><h1>SR দোকান ম্যাপ</h1><button id="addSR" class="btn primary">SR add +</button></header><main class="home"><h2>SR তালিকা</h2><div id="srCards" class="cards"></div></main></section>
<section id="listScreen" class="screen"><div class="listPage"><div class="listHead"><button id="listBack" class="icon" aria-label="ফিরুন">‹</button><h2 id="listTitle"></h2><button id="listMap" class="btn primary">লোকেশন</button></div><div id="shopList"></div></div></section>
<section id="mapScreen" class="screen mapScreen"><div id="map"></div><div class="mapTop"><button id="mapBack" class="icon" aria-label="ফিরুন">‹</button><div id="mapTitle" class="mapTitle"></div><div class="mapRight"><button id="locate" class="icon" aria-label="আমার লোকেশন" title="আমার লোকেশন">◎</button><button id="mapMenu" class="icon" aria-label="SR সম্পাদনা" title="SR সম্পাদনা">⋮</button></div></div><div id="mapNotice" class="mapNotice"></div><div class="mapBottom"><button id="addShop" class="btn primary">+ দোকান</button><button id="mapShopList" class="btn">দোকান লিস্ট</button></div><div id="drawOverlay" class="drawOverlay"></div><div id="drawActions" class="drawActions"><button id="retryDraw" class="btn">আবার আঁকুন</button><button id="saveDraw" class="btn primary" disabled>সংরক্ষণ</button></div><div id="shopSheet" class="sheet" hidden></div></section>
<dialog id="srOptions" class="modal"><h2 id="optionTitle"></h2><div style="display:grid;gap:9px"><button id="optionMap" class="btn primary">Open Location</button><button id="optionList" class="btn">Shop List</button><button id="optionEdit" class="btn">SR সম্পাদনা</button></div><footer><button class="btn" type="button" data-close="srOptions">বন্ধ</button></footer></dialog>
<dialog id="srDialog" class="modal"><form id="srForm"><h2 id="srDialogTitle">SR যোগ করুন</h2><label for="srName">SR-এর নাম</label><input id="srName" required maxlength="80"><footer><button type="button" class="btn" data-close="srDialog">বাতিল</button><button class="btn primary">সংরক্ষণ</button></footer></form></dialog>
<dialog id="editOptions" class="modal"><h2>SR সম্পাদনা</h2><div style="display:grid;gap:9px"><button id="editName" class="btn">নাম পরিবর্তন</button><button id="editArea" class="btn">সীমানা নতুন করে আঁকুন</button></div><footer><button class="btn" data-close="editOptions">বন্ধ</button></footer></dialog>
<dialog id="shopDialog" class="modal"><form id="shopForm"><h2>দোকান যোগ করুন</h2><label for="shopName">দোকানের নাম</label><input id="shopName" required maxlength="100"><label for="ownerName">দোকানদারের নাম</label><input id="ownerName" required maxlength="100"><label for="phone">মোবাইল নাম্বার</label><input id="phone" type="tel" required maxlength="22"><label for="photo">দোকানের ছবি</label><input id="photo" type="file" accept="image/*"><footer><button type="button" class="btn" data-close="shopDialog">বাতিল</button><button class="btn primary">সংরক্ষণ</button></footer></form></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='sr-shop-map-v2';
let records=[];try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v?.srs))records=v.srs}catch{}
const uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({srs:records}));return true}catch{alert('তথ্য সংরক্ষণ করা যায়নি। ছবির আকার ছোট করে চেষ্টা করুন।');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let active=null,chosen=null,mode='home',pendingName='',editing=null,points=[],stroke=null,drawing=false,picked=null,watch=null,myMarker=null,myPoint=null,routeLine=null,routeTarget=null,firstFocus=false,labels=[];
const sr=()=>records.find(x=>x.id===active);
const polygon=x=>x.polygon||[[x.bounds.s,x.bounds.w],[x.bounds.n,x.bounds.w],[x.bounds.n,x.bounds.e],[x.bounds.s,x.bounds.e]];
function inside(p,x){if(!x)return false;let yes=false;const a=polygon(x);for(let i=0,j=a.length-1;i<a.length;j=i++){const u=a[i],v=a[j];if((u[0]>p.lat)!==(v[0]>p.lat)&&p.lng<(v[1]-u[1])*(p.lat-u[0])/(v[0]-u[0])+u[1])yes=!yes}return yes}
const map=L.map('map',{zoomControl:true}).setView([23.8103,90.4125],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const layers=L.layerGroup().addTo(map);
function screen(name){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(name+'Screen').classList.add('active');mode=name;if(name==='map')setTimeout(()=>map.invalidateSize(),40)}
function cards(){const root=$('srCards');root.replaceChildren();if(!records.length){const p=document.createElement('p');p.className='empty';p.textContent='এখনো কোনো SR যোগ করা হয়নি।';root.append(p)}records.forEach(x=>{const box=document.createElement('div');box.className='card';const title=document.createElement('button');title.textContent=x.name;title.onclick=()=>options(x.id);const count=document.createElement('small');count.textContent=(x.shops||[]).length+'টি দোকান';const actions=document.createElement('div');actions.className='cardActions';const open=document.createElement('button');open.className='btn primary';open.textContent='Open Location';open.onclick=()=>openMap(x.id);const list=document.createElement('button');list.className='btn';list.textContent='Shop List';list.onclick=()=>openList(x.id);actions.append(open,list);box.append(title,count,actions);root.append(box)})}
function options(id){chosen=id;$('optionTitle').textContent=records.find(x=>x.id===id)?.name||'';$('srOptions').showModal()}
function renderMap(){layers.clearLayers();labels=[];const x=sr();if(!x)return;const ring=polygon(x);L.polygon([[[-85,-180],[-85,180],[85,180],[85,-180]],ring],{color:'#34465c',weight:0,fillColor:'#34465c',fillOpacity:.54,fillRule:'evenodd',interactive:false}).addTo(layers);L.polygon(ring,{color:'#169a70',weight:3,fillColor:'#1aa879',fillOpacity:.08,interactive:false}).addTo(layers);(x.shops||[]).forEach(shop=>{const marker=L.marker([shop.lat,shop.lng]).addTo(layers);marker.on('click',()=>showShop(shop.id));const label=L.marker([shop.lat,shop.lng],{icon:L.divIcon({className:'labelIcon',html:`<div class="shopLabel">${esc(shop.name)}</div>`,iconSize:[155,32],iconAnchor:[-12,40]}),interactive:true});label.on('click',()=>showShop(shop.id));labels.push(label)});updateLabels();if(routeLine)routeLine.addTo(map)}
function updateLabels(){labels.forEach(l=>{if(map.getZoom()>=16){if(!layers.hasLayer(l))layers.addLayer(l)}else if(layers.hasLayer(l))layers.removeLayer(l)})}map.on('zoomend',updateLabels);
function clearRoute(){if(routeLine){map.removeLayer(routeLine);routeLine=null}routeTarget=null}
function stopGPS(){if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}if(myMarker){map.removeLayer(myMarker);myMarker=null}myPoint=null;firstFocus=false}
function gps(focus=true){if(!navigator.geolocation||!window.isSecureContext){notice('লোকেশনের জন্য HTTPS-এ খুলুন');return}if(watch!==null){if(focus&&myPoint)map.setView(myPoint,17);return}firstFocus=!focus;notice('লোকেশন লোড হচ্ছে…');watch=navigator.geolocation.watchPosition(p=>{myPoint=[p.coords.latitude,p.coords.longitude];if(myMarker)myMarker.setLatLng(myPoint);else myMarker=L.circleMarker(myPoint,{radius:9,color:'#fff',weight:3,fillColor:'#1877e8',fillOpacity:1}).addTo(map).bindPopup('আপনার লোকেশন');if(!firstFocus){map.setView(myPoint,17);firstFocus=true}notice('');},e=>{if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}notice(e.code===1?'লোকেশন পারমিশন Allow করুন':'লোকেশন পাওয়া যায়নি')},{enableHighAccuracy:true,timeout:15000,maximumAge:3000})}
let noticeTimer;function notice(message){$('mapNotice').textContent=message;clearTimeout(noticeTimer);if(message&&message!=='লোকেশন লোড হচ্ছে…')noticeTimer=setTimeout(()=>$('mapNotice').textContent='',4500)}
function openMap(id){active=id;chosen=id;clearRoute();$('shopSheet').hidden=true;$('mapTitle').textContent=sr().name;screen('map');renderMap();setTimeout(()=>map.fitBounds(L.latLngBounds(polygon(sr())),{padding:[35,35],maxZoom:16}),80);gps(true)}
function openList(id){active=id;chosen=id;stopGPS();screen('list');$('listTitle').textContent=sr().name;renderList()}
function renderList(){const root=$('shopList');root.replaceChildren();const shops=sr()?.shops||[];if(!shops.length){const p=document.createElement('p');p.className='empty';p.textContent='কোনো দোকান নেই';root.append(p)}shops.forEach(shop=>{const row=document.createElement('div');row.className='listItem';if(shop.photo){const img=document.createElement('img');img.src=shop.photo;img.alt='';row.append(img)}const info=document.createElement('div');const title=document.createElement('strong');title.textContent=shop.name;const sub=document.createElement('small');sub.textContent=shop.owner+' · '+shop.phone;info.append(title,sub);const view=document.createElement('button');view.className='btn';view.textContent='View';view.onclick=()=>{openMap(active);map.setView([shop.lat,shop.lng],17);showShop(shop.id)};row.append(info,view);root.append(row)})}
function showShop(id){const shop=sr()?.shops.find(x=>x.id===id);if(!shop)return;picked={lat:shop.lat,lng:shop.lng};map.setView([shop.lat,shop.lng],Math.max(16,map.getZoom()));const sheet=$('shopSheet');sheet.replaceChildren();const head=document.createElement('div');head.className='sheetHeader';const info=document.createElement('div');const name=document.createElement('h2');name.textContent=shop.name;const owner=document.createElement('p');owner.textContent=shop.owner;info.append(name,owner);const close=document.createElement('button');close.className='icon';close.textContent='×';close.onclick=()=>sheet.hidden=true;head.append(info,close);sheet.append(head);if(shop.photo){const img=document.createElement('img');img.className='shopImage';img.src=shop.photo;img.alt=shop.name;sheet.append(img)}const phone=document.createElement('p');phone.textContent='মোবাইল: '+shop.phone;sheet.append(phone);const actions=document.createElement('div');actions.className='sheetButtons';const dest=document.createElement('button');dest.className='btn primary';dest.textContent='Destination';dest.onclick=()=>directions(shop);const call=document.createElement('a');call.className='btn';call.textContent='Call';call.href='tel:'+shop.phone.replace(/[^+\d]/g,'');call.style.textAlign='center';const nav=document.createElement('button');nav.className='btn';nav.textContent='Google Maps-এ চালু';nav.onclick=()=>{const url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(shop.lat+','+shop.lng)+'&travelmode=driving&dir_action=navigate';window.open(url,'_blank','noopener')};const del=document.createElement('button');del.className='btn danger';del.textContent='মুছুন';del.onclick=()=>{if(!confirm('এই দোকান মুছবেন?'))return;sr().shops=sr().shops.filter(x=>x.id!==id);save();sheet.hidden=true;clearRoute();renderMap();cards()};actions.append(dest,call,nav,del);sheet.append(actions);sheet.hidden=false}
async function directions(shop){routeTarget=shop;if(!myPoint){gps(true);notice('লোকেশন লোড হলে Destination আবার চাপুন');return}clearRoute();routeTarget=shop;notice('রুট লোড হচ্ছে…');try{const url=`https://router.project-osrm.org/route/v1/driving/${myPoint[1]},${myPoint[0]};${shop.lng},${shop.lat}?overview=full&geometries=geojson`;const response=await fetch(url);if(!response.ok)throw Error('route');const data=await response.json();if(data.code!=='Ok'||!data.routes?.length)throw Error('route');const coordinates=data.routes[0].geometry.coordinates.map(([lng,lat])=>[lat,lng]);routeLine=L.polyline(coordinates,{color:'#1877e8',weight:6,opacity:.9}).addTo(map);$('shopSheet').hidden=true;map.fitBounds(routeLine.getBounds(),{padding:[70,50]});notice((data.routes[0].distance/1000).toFixed(1)+' কিমি · প্রায় '+Math.round(data.routes[0].duration/60)+' মিনিট')}catch{notice('এই মুহূর্তে রুট পাওয়া যায়নি। Google Maps-এ চালু চাপুন।')}}
function editMenu(){if(!sr())return;$('editOptions').showModal()}
function resetDraw(){points=[];drawing=false;stroke?.remove();stroke=null;$('saveDraw').disabled=true;notice('আঙুল দিয়ে সীমানা আঁকুন')}
function drawArea(name,existing=null){stopGPS();clearRoute();pendingName=name;editing=existing;active=null;layers.clearLayers();screen('map');$('mapTitle').textContent=name;$('shopSheet').hidden=true;$('drawOverlay').classList.add('active');$('drawActions').classList.add('active');$('addShop').hidden=true;$('mapShopList').hidden=true;$('mapMenu').hidden=true;$('locate').hidden=true;resetDraw();setTimeout(()=>{map.invalidateSize();if(existing)map.fitBounds(L.latLngBounds(polygon(existing)),{padding:[35,35]})},60)}
function endDraw(){editing=null;$('drawOverlay').classList.remove('active');$('drawActions').classList.remove('active');$('addShop').hidden=false;$('mapShopList').hidden=false;$('mapMenu').hidden=false;$('locate').hidden=false;notice('')}
const overlay=$('drawOverlay');function position(e){const b=map.getContainer().getBoundingClientRect();return map.containerPointToLatLng([e.clientX-b.left,e.clientY-b.top])}
overlay.addEventListener('pointerdown',e=>{e.preventDefault();resetDraw();drawing=true;overlay.setPointerCapture(e.pointerId);const p=position(e);points.push([p.lat,p.lng]);stroke=L.polyline(points,{color:'#e15a20',weight:4,interactive:false}).addTo(layers)});
overlay.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=position(e);if(map.latLngToContainerPoint(points.at(-1)).distanceTo(map.latLngToContainerPoint(p))<5)return;points.push([p.lat,p.lng]);stroke.setLatLngs(points)});
function finishDraw(e){if(!drawing)return;e.preventDefault();drawing=false;if(points.length<3){resetDraw();return}stroke.setLatLngs([...points,points[0]]);$('saveDraw').disabled=false;notice('সীমানা ঠিক থাকলে সংরক্ষণ চাপুন')}
overlay.addEventListener('pointerup',finishDraw);overlay.addEventListener('pointercancel',finishDraw);
$('retryDraw').onclick=resetDraw;$('saveDraw').onclick=()=>{if(points.length<3)return;let x=editing;const old=x?.polygon;if(x)x.polygon=points;else{x={id:uid(),name:pendingName,polygon:points,shops:[]};records.push(x)}if(!save()){if(editing)editing.polygon=old;else records.pop();return}endDraw();cards();openMap(x.id)};
map.on('click',e=>{if(mode!=='map'||$('drawOverlay').classList.contains('active'))return;picked=e.latlng;if(!inside(picked,sr())){notice('এই জায়গাটি SR এলাকার বাইরে');return}L.popup().setLatLng(picked).setContent('<button id="popupAdd">+ দোকান যোগ করুন</button>').openOn(map)});
map.on('popupopen',e=>{const b=e.popup.getElement()?.querySelector('#popupAdd');if(b)b.onclick=()=>shopDialog()});
function shopDialog(){if(!picked||!inside(picked,sr())){notice('আগে SR এলাকার ভেতরে ম্যাপে ট্যাপ করুন');return}map.closePopup();$('shopForm').reset();$('shopDialog').showModal()}
function compress(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const ratio=Math.min(1,700/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.68))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}
$('shopForm').onsubmit=async e=>{e.preventDefault();if(!sr()||!picked||!inside(picked,sr()))return;let photo='';try{photo=await compress($('photo').files[0])}catch{alert('ছবিটি পড়া যায়নি');return}const shop={id:uid(),lat:picked.lat,lng:picked.lng,name:$('shopName').value.trim(),owner:$('ownerName').value.trim(),phone:$('phone').value.trim(),photo};if(!shop.name||!shop.owner||!shop.phone)return;sr().shops.push(shop);if(!save()){sr().shops.pop();return}$('shopDialog').close();renderMap();cards();showShop(shop.id)};
$('addSR').onclick=()=>{editing=null;$('srDialogTitle').textContent='SR যোগ করুন';$('srForm').reset();$('srDialog').showModal()};
$('srForm').onsubmit=e=>{e.preventDefault();const name=$('srName').value.trim();if(!name)return;$('srDialog').close();if(editing){editing.name=name;save();cards();$('mapTitle').textContent=name;editing=null;return}drawArea(name)};
$('optionMap').onclick=()=>{$('srOptions').close();openMap(chosen)};$('optionList').onclick=()=>{$('srOptions').close();openList(chosen)};$('optionEdit').onclick=()=>{$('srOptions').close();active=chosen;editMenu()};
$('editName').onclick=()=>{editing=sr();$('editOptions').close();$('srDialogTitle').textContent='SR-এর নাম পরিবর্তন';$('srName').value=editing.name;$('srDialog').showModal()};$('editArea').onclick=()=>{const x=sr();$('editOptions').close();drawArea(x.name,x)};
$('mapMenu').onclick=editMenu;$('locate').onclick=()=>{firstFocus=false;if(myPoint)map.setView(myPoint,17);else gps(true)};$('addShop').onclick=()=>shopDialog();$('mapShopList').onclick=()=>openList(active);$('listMap').onclick=()=>openMap(active);$('listBack').onclick=()=>{screen('home');cards()};$('mapBack').onclick=()=>{if($('drawOverlay').classList.contains('active')){endDraw();layers.clearLayers()}stopGPS();clearRoute();$('shopSheet').hidden=true;screen('home');cards()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());cards();
})();
</script>
</body>
