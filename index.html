<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102e38">
<title>SR Atlas</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  font-family:system-ui,'Noto Sans Bengali',sans-serif;
  color:#15333e;
  background:#f3f7f6;
  --green:#087f72;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button,input{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.45;cursor:default}
.btn{
  padding:12px 16px;
  border-radius:13px;
  background:#e9f3f1;
  color:#146456;
  font-weight:750;
  text-decoration:none;
  text-align:center;
}
.primary{background:#087f72;color:#fff}
.danger{background:#fff0f1;color:#b5384a}
.icon{
  height:45px;
  min-width:45px;
  border-radius:14px;
  background:white;
  color:#15333e;
  font-size:22px;
  box-shadow:0 4px 20px #12353c20;
}
.view{display:none}
.view.on{display:block}

#loginView.on{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(145deg,#102e38,#087f72);
}
.loginCard{
  width:min(400px,100%);
  padding:30px;
  background:white;
  border-radius:24px;
  box-shadow:0 20px 70px #0003;
}
.loginCard h1{
  margin:0 0 25px;
  text-align:center;
  font-size:29px;
}
.loginCard label{
  display:block;
  margin:14px 0 7px;
  font-weight:700;
}
.loginCard input{
  width:100%;
  padding:13px;
  border:1px solid #d5e3df;
  border-radius:12px;
}
.loginCard button{width:100%}
.error{
  color:#b22c46;
  min-height:22px;
  font-size:13px;
  line-height:1.6;
}

header{
  background:linear-gradient(120deg,#102e38,#17685d);
  color:white;
  padding:24px 18px 48px;
}
.wrap{max-width:1100px;margin:auto}
.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand{margin:0;font-size:27px;letter-spacing:-1px}
.headActions{display:flex;gap:8px}
.headActions .btn{padding:10px 13px}

.home{
  max-width:1100px;
  margin:-25px auto 0;
  padding:0 18px 28px;
  position:relative;
}
.stats{
  display:flex;
  gap:12px;
  background:white;
  border-radius:18px;
  padding:18px 24px;
  box-shadow:0 8px 25px #123b3a0c;
  margin-bottom:20px;
}
.stats div{flex:1}
.stats strong{display:block;font-size:25px}
.stats small{color:#698079}

.search{
  width:100%;
  border:1px solid #d8e5e0;
  background:white;
  border-radius:14px;
  padding:13px 15px;
  margin-bottom:18px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}
.card{
  background:var(--card-bg);
  border:1px solid var(--card-edge);
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 26px #17403508;
}
.cardTitle{
  display:block;
  width:100%;
  padding:0;
  margin:12px 0 5px;
  text-align:left;
  background:none;
  color:var(--card-color);
  font-size:22px;
  font-weight:800;
}
.card small{color:#61766d}
.badge{
  color:var(--card-color);
  background:#ffffffaa;
  border-radius:10px;
  padding:8px;
  display:inline-block;
  font-size:18px;
}
.card .btn{background:#ffffffaa;color:var(--card-color)}
.card .primary{background:var(--card-color);color:white}
.row{display:flex;gap:8px;margin-top:18px}
.row>*{flex:1}
.empty{
  background:white;
  padding:28px;
  border-radius:18px;
  color:#617b73;
  text-align:center;
  grid-column:1/-1;
}

.mapView{height:100dvh;position:relative;overflow:hidden}
#map{height:100%;width:100%;background:#e8f1eb}
.toolbar{
  position:absolute;
  z-index:800;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  display:flex;
  gap:8px;
  pointer-events:none;
  align-items:start;
}
.toolbar>*{pointer-events:auto}
.mapTitle{
  background:white;
  box-shadow:0 4px 20px #12353c20;
  padding:10px 14px;
  border-radius:14px;
  max-width:350px;
  min-width:0;
}
.mapTitle strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.mapTitle small{font-size:11px;color:#647e75}
.tools{margin-left:auto;display:grid;gap:8px}
.bottom{
  position:absolute;
  z-index:800;
  left:12px;
  right:12px;
  bottom:32px;
  display:flex;
  gap:8px;
  max-width:550px;
}
.bottom>*{flex:1;box-shadow:0 3px 15px #12353c22}
.drawbar{
  position:absolute;
  z-index:820;
  left:12px;
  right:12px;
  bottom:32px;
  background:white;
  border-radius:18px;
  padding:10px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  max-width:650px;
  margin:auto;
  box-shadow:0 4px 25px #12353c33;
}
.drawbar button{flex:1;font-size:13px}
.drawbar .selected{background:#153e48;color:white}
.sheet{
  position:absolute;
  z-index:850;
  bottom:0;
  left:0;
  right:0;
  border-radius:23px 23px 0 0;
  background:white;
  padding:22px 20px max(25px,env(safe-area-inset-bottom));
  max-height:72dvh;
  overflow:auto;
  box-shadow:0 -5px 35px #122f3b30;
}
.sheetHead{display:flex;gap:10px;align-items:start}
.sheetHead div{flex:1}
.sheet h2{margin:7px 0}
.sheet p{color:#637d76;margin:5px 0}
.sheet img{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:14px;
  margin:12px 0;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}
.serial{color:#087f72;font-weight:800;font-size:12px}

.list{max-width:900px;padding:20px;margin:auto}
.listTop{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}
.listTop h2{flex:1;margin:0}
.shopRow{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  margin:10px 0;
  background:white;
  border-radius:16px;
  border:1px solid #e0eae5;
}
.shopRow img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:12px;
}
.shopRow .info{flex:1;min-width:0}
.shopRow strong{display:block}
.shopRow small{
  display:block;
  color:#6e827b;
  margin:5px 0;
  overflow-wrap:anywhere;
}

.modal{
  border:0;
  border-radius:22px;
  width:min(480px,calc(100vw - 24px));
  max-height:88dvh;
  padding:24px;
  color:#15333e;
  box-shadow:0 20px 60px #102e3850;
}
.modal::backdrop{
  background:#102e387d;
  backdrop-filter:blur(3px);
}
.modal h2{margin:0 0 14px}
.modal label{display:block;font-weight:750;margin:13px 0 6px}
.modal input{
  width:100%;
  border:1px solid #cdded5;
  border-radius:11px;
  padding:12px;
}
.modal footer{
  display:flex;
  justify-content:end;
  gap:8px;
  margin-top:22px;
}
.stack{display:grid;gap:9px}

.toast{
  position:fixed;
  z-index:4000;
  top:85px;
  left:50%;
  transform:translateX(-50%);
  max-width:90%;
  border-radius:14px;
  padding:11px 16px;
  background:#123843;
  color:white;
  box-shadow:0 5px 22px #12353c30;
  font-size:14px;
  text-align:center;
}
.toast:empty{display:none}
.pin{background:none;border:0}
.pin span{
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  background:#087f72;
  color:white;
  border:3px solid white;
  border-radius:50% 50% 50% 6px;
  transform:rotate(-45deg);
  box-shadow:0 3px 10px #153e4844;
}
.pin b{transform:rotate(45deg);font-size:12px}
.leaflet-tooltip.shopLabel{
  border:1px solid #c4ded3;
  border-radius:8px;
  font-weight:750;
  box-shadow:0 3px 10px #122e3820;
}
.vertex{
  border:3px solid white;
  background:#f16b38;
  border-radius:50%;
  box-shadow:0 3px 12px #12353c50;
}
.vertex.active{
  background:#163d49;
  border:3px solid #ffbb82;
}
.leaflet-control-zoom{
  margin-top:100px!important;
  border:0!important;
  box-shadow:0 4px 20px #12353c20!important;
}
.leaflet-bar a{border-radius:8px!important}
.leaflet-control-attribution{font-size:10px}

@media(max-width:600px){
  .brand{font-size:23px}
  .headActions .btn{padding:9px 11px;font-size:12px}
  .mapTitle{max-width:calc(100vw - 136px)}
  .bottom .btn{font-size:13px;padding:12px 8px}
  .stats{padding:15px 19px}
  .shopRow{gap:8px}
  .shopRow .btn{padding:10px}
  .drawbar button{min-width:90px}
  .modal{padding:20px}
}
</style>
</head>

<body>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<section id="loginView" class="view on">
  <div class="loginCard">
    <h1>SR Atlas</h1>

    <form id="loginForm">
      <label for="email">ইমেইল</label>
      <input
        id="email"
        type="email"
        required
        autocomplete="username"
      >

      <label for="password">পাসওয়ার্ড</label>
      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
      >

      <p id="loginError" class="error" role="alert"></p>

      <button id="loginSubmit" class="btn primary">লগইন</button>
    </form>
  </div>
</section>

<section id="homeView" class="view">
  <header>
    <div class="wrap head">
      <h1 class="brand">SR Atlas</h1>

      <div class="headActions">
        <button id="account" class="btn">লগআউট</button>
        <button id="newSR" class="btn primary" data-write>
          + SR add
        </button>
      </div>
    </div>
  </header>

  <main class="home">
    <div class="stats">
      <div>
        <strong id="srCount">0</strong>
        <small>SR</small>
      </div>

      <div>
        <strong id="shopCount">0</strong>
        <small>দোকান</small>
      </div>
    </div>

    <input
      id="srSearch"
      class="search"
      placeholder="SR খুঁজুন"
      aria-label="SR খুঁজুন"
    >

    <div id="cards" class="cards"></div>
  </main>
</section>

<section id="listView" class="view">
  <main class="list">
    <div class="listTop">
      <button id="listBack" class="icon" aria-label="ফিরুন">‹</button>
      <h2 id="listTitle"></h2>
      <button id="listMap" class="btn primary">ম্যাপ</button>
    </div>

    <input
      id="shopSearch"
      class="search"
      placeholder="দোকান খুঁজুন"
      aria-label="দোকান খুঁজুন"
    >

    <div id="shopList"></div>
  </main>
</section>

<section id="mapView" class="view mapView">
  <div id="map"></div>

  <div class="toolbar">
    <button id="mapBack" class="icon" aria-label="ফিরুন">‹</button>

    <div class="mapTitle">
      <strong id="mapTitle"></strong>
      <small id="mapSub"></small>
    </div>

    <div class="tools">
      <button id="locate" class="icon" aria-label="আমার লোকেশন">◎</button>
      <button id="fit" class="icon" aria-label="সম্পূর্ণ এলাকা">⛶</button>
      <button id="menu" class="icon" aria-label="SR সম্পাদনা">⋮</button>
    </div>
  </div>

  <div id="bottom" class="bottom">
    <button id="addShop" class="btn primary" data-write>+ দোকান</button>
    <button id="shopListBtn" class="btn">দোকান লিস্ট</button>
  </div>

  <div id="drawbar" class="drawbar" hidden>
    <button id="zoomToggle" class="btn">জুম / সরান: বন্ধ</button>
    <button id="addCorner" class="btn">+ কোণা</button>
    <button id="removeCorner" class="btn danger">কোণা মুছুন</button>
    <button id="cancelArea" class="btn">বাতিল</button>
    <button id="saveArea" class="btn primary" data-write>সংরক্ষণ</button>
  </div>

  <div id="sheet" class="sheet" hidden></div>
</section>

<dialog id="nameDialog" class="modal">
  <form id="nameForm">
    <h2 id="nameTitle">নতুন SR</h2>

    <label for="srName">SR-এর নাম</label>
    <input id="srName" required maxlength="80">

    <footer>
      <button type="button" class="btn" data-close="nameDialog">
        বাতিল
      </button>
      <button class="btn primary" data-write>পরবর্তী ধাপ</button>
    </footer>
  </form>
</dialog>

<dialog id="editDialog" class="modal">
  <h2 id="editTitle">SR সম্পাদনা</h2>

  <div class="stack">
    <button id="renameSR" class="btn" data-write>নাম পরিবর্তন</button>
    <button id="editDistance" class="btn primary" data-write>
      Map Distance
    </button>
  </div>

  <footer>
    <button class="btn" data-close="editDialog">বন্ধ</button>
  </footer>
</dialog>

<dialog id="shopDialog" class="modal">
  <form id="shopForm">
    <h2>দোকান যোগ করুন</h2>

    <label for="shopName">দোকানের নাম</label>
    <input id="shopName" required maxlength="100">

    <label for="owner">দোকানদারের নাম</label>
    <input id="owner" required maxlength="100">

    <label for="phone">মোবাইল নাম্বার</label>
    <input id="phone" type="tel" required maxlength="22">

    <label for="photo">দোকানের ছবি</label>
    <input id="photo" type="file" accept="image/*">

    <p id="shopError" class="error" role="alert"></p>

    <footer>
      <button type="button" class="btn" data-close="shopDialog">
        বাতিল
      </button>
      <button class="btn primary" data-write>সংরক্ষণ</button>
    </footer>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import {
  initializeApp
} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';

import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyAhlvysObnxXKg2HO3b0z0U8aBwQ6Xakos",
  authDomain: "rahad-map-ab322.firebaseapp.com",
  databaseURL: "https://rahad-map-ab322-default-rtdb.firebaseio.com",
  projectId: "rahad-map-ab322",
  storageBucket: "rahad-map-ab322.firebasestorage.app",
  messagingSenderId: "111356994872",
  appId: "1:111356994872:web:f583173bf0fcc301ef0dcd",
  measurementId: "G-Q43YDPJJZF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const atlas = ref(db, 'srAtlas');

const $ = id => document.getElementById(id);
const clone = value => JSON.parse(JSON.stringify(value));

let state = {srs: {}, nextGlobal: 1};
let current = null;
let mode = 'login';
let ready = false;
let connected = false;
let allowed = false;
let busy = false;
let preparingShop = false;

let unsubscribe = null;
let memberUnsubscribe = null;

let drawing = false;
let editingArea = null;
let editingName = null;
let pendingName = '';
let points = [];
let selectedCorner = -1;
let addingCorner = false;
let zooming = false;
let areaPoly = null;
let handles = [];

let selected = null;
let shownShop = null;

let watch = null;
let myPos = null;
let myMarker = null;
let accuracy = null;
let centerNext = false;

let route = null;
let routeController = null;

const colors = [
  {bg:'#eaf2ff', main:'#2463df', edge:'#d2e3ff'},
  {bg:'#e7f7ee', main:'#128453', edge:'#c7ead7'},
  {bg:'#ffeded', main:'#ce4141', edge:'#ffd3d3'},
  {bg:'#f1ebff', main:'#7a4bd0', edge:'#ded1fb'},
  {bg:'#fff3df', main:'#b57812', edge:'#f6dfb3'},
  {bg:'#e6f7fc', main:'#1488a2', edge:'#c4e8f1'},
  {bg:'#ffeaf4', main:'#be397b', edge:'#f5cee1'},
  {bg:'#eef0f4', main:'#546276', edge:'#d9dfe7'}
];

const sr = () => state.srs?.[current];
const shops = item => Object.values(item?.shops || {});

function srs() {
  return Object.values(state.srs || {}).sort((a, b) =>
    (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0) ||
    String(a.id).localeCompare(String(b.id))
  );
}

function id() {
  return crypto.randomUUID?.() ||
    Date.now() + '-' + Math.random().toString(36).slice(2);
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[c]);
}

function toast(message) {
  $('toast').textContent = message;
  clearTimeout(toast.timer);

  if (message) {
    toast.timer = setTimeout(() => {
      $('toast').textContent = '';
    }, 4500);
  }
}

function errorText(error) {
  const code = error?.code || '';
  const message = error?.message || '';

  if (/permission/i.test(code + ' ' + message)) {
    return 'এই অ্যাকাউন্টের অনুমতি নেই।';
  }

  if (/invalid-credential|wrong-password|user-not-found/.test(code)) {
    return 'ইমেইল বা পাসওয়ার্ড ঠিক নয়।';
  }

  if (/operation-not-allowed/.test(code)) {
    return 'Email/Password login চালু নেই।';
  }

  if (/network/.test(code)) {
    return 'ইন্টারনেট সংযোগ পরীক্ষা করুন।';
  }

  if (/too-many/.test(code)) {
    return 'একটু পরে আবার চেষ্টা করুন।';
  }

  return message || 'কাজটি সম্পন্ন হয়নি।';
}

function syncStatus() {
  const good = !!auth.currentUser && connected && ready && allowed;

  document.querySelectorAll('[data-write]').forEach(button => {
    button.disabled = !good || busy || preparingShop;
  });
}

function show(view) {
  document.querySelectorAll('.view').forEach(element => {
    element.classList.remove('on');
  });

  $(view + 'View').classList.add('on');
  mode = view;

  if (view === 'map') {
    requestAnimationFrame(() => map.invalidateSize());
  }
}

async function mutate(change) {
  if (!auth.currentUser || !allowed || !ready || !connected) {
    throw Error('ইন্টারনেট সংযোগ ও অ্যাকাউন্টের অনুমতি পরীক্ষা করুন।');
  }

  if (busy) {
    throw Error('সংরক্ষণ শেষ হওয়া পর্যন্ত অপেক্ষা করুন।');
  }

  busy = true;
  syncStatus();

  try {
    const result = await runTransaction(
      atlas,
      data => {
        const next = data || {srs: {}, nextGlobal: 1};

        next.srs ||= {};
        next.nextGlobal = Math.max(1, Number(next.nextGlobal) || 1);

        change(next);
        return next;
      },
      {applyLocally: false}
    );

    if (!result.committed) {
      throw Error('সংরক্ষণ হয়নি।');
    }

    state = result.snapshot.val() || {srs: {}, nextGlobal: 1};
    renderAll();
    toast('সংরক্ষণ হয়েছে ✓');
  } finally {
    busy = false;
    syncStatus();
  }
}

const map = L.map('map', {
  zoomControl: true
}).setView([23.8103, 90.4125], 13);

const tiles = L.tileLayer(
  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">' +
      'OpenStreetMap</a> contributors'
  }
).addTo(map);

let tileErrors = 0;

tiles.on('tileerror', () => {
  if (++tileErrors === 3) {
    toast('ম্যাপ লোড হয়নি। সংযোগ পরীক্ষা করুন।');
  }
});

tiles.on('tileload', () => tileErrors = 0);

L.control.scale({
  imperial: false,
  position: 'bottomleft'
}).addTo(map);

const mapLayer = L.layerGroup().addTo(map);
const drawLayer = L.layerGroup().addTo(map);

function ring(item) {
  if (Array.isArray(item?.polygon)) return item.polygon;

  if (item?.bounds) {
    return [
      [item.bounds.s, item.bounds.w],
      [item.bounds.n, item.bounds.w],
      [item.bounds.n, item.bounds.e],
      [item.bounds.s, item.bounds.e]
    ];
  }

  return [];
}

function validRing(vertices) {
  if (!Array.isArray(vertices) || vertices.length < 3) return false;

  if (!vertices.every(point =>
    Array.isArray(point) &&
    point.length === 2 &&
    Number.isFinite(point[0]) &&
    Math.abs(point[0]) <= 85 &&
    Number.isFinite(point[1]) &&
    Math.abs(point[1]) <= 180
  )) return false;

  const area = vertices.reduce((total, a, index) => {
    const b = vertices[(index + 1) % vertices.length];
    return total + a[1] * b[0] - b[1] * a[0];
  }, 0);

  return Math.abs(area) > 1e-12;
}

function selfCross(vertices) {
  const cross = (a, b, c) =>
    (b[1] - a[1]) * (c[0] - a[0]) -
    (b[0] - a[0]) * (c[1] - a[1]);

  const between = (a, b, c) =>
    Math.min(a[0], b[0]) <= c[0] &&
    c[0] <= Math.max(a[0], b[0]) &&
    Math.min(a[1], b[1]) <= c[1] &&
    c[1] <= Math.max(a[1], b[1]);

  for (let i = 0; i < vertices.length; i++) {
    for (let j = i + 1; j < vertices.length; j++) {
      if (
        j === i + 1 ||
        (i === 0 && j === vertices.length - 1)
      ) continue;

      const a = vertices[i];
      const b = vertices[(i + 1) % vertices.length];
      const c = vertices[j];
      const d = vertices[(j + 1) % vertices.length];

      const x = cross(a, b, c);
      const y = cross(a, b, d);
      const z = cross(c, d, a);
      const w = cross(c, d, b);

      if (
        (x * y < 0 && z * w < 0) ||
        (x === 0 && between(a, b, c)) ||
        (y === 0 && between(a, b, d)) ||
        (z === 0 && between(c, d, a)) ||
        (w === 0 && between(c, d, b))
      ) return true;
    }
  }

  return false;
}

function inside(point, item) {
  const vertices = ring(item);
  let result = false;

  for (
    let i = 0, j = vertices.length - 1;
    i < vertices.length;
    j = i++
  ) {
    const a = vertices[i];
    const b = vertices[j];

    const dx = b[1] - a[1];
    const dy = b[0] - a[0];

    const t = dx * dx + dy * dy
      ? (
          (point.lng - a[1]) * dx +
          (point.lat - a[0]) * dy
        ) / (dx * dx + dy * dy)
      : 0;

    if (
      t >= 0 &&
      t <= 1 &&
      Math.hypot(
        point.lng - (a[1] + t * dx),
        point.lat - (a[0] + t * dy)
      ) < 1e-9
    ) return true;

    if (
      (a[0] > point.lat) !== (b[0] > point.lat) &&
      point.lng <
        (b[1] - a[1]) *
        (point.lat - a[0]) /
        (b[0] - a[0]) + a[1]
    ) {
      result = !result;
    }
  }

  return result;
}

function fit() {
  const vertices = drawing ? points : ring(sr());

  if (vertices.length) {
    map.fitBounds(L.latLngBounds(vertices), {
      paddingTopLeft: [45, 95],
      paddingBottomRight: [45, 110],
      maxZoom: 17
    });
  }
}

function renderCards() {
  const items = srs();
  const query = $('srSearch').value.trim().toLowerCase();

  $('srCount').textContent = items.length;
  $('shopCount').textContent = items.reduce(
    (total, item) => total + shops(item).length,
    0
  );

  $('cards').replaceChildren();

  items.forEach((item, index) => {
    if (!String(item.name).toLowerCase().includes(query)) return;

    const color = colors[index % colors.length];
    const card = document.createElement('article');
    card.className = 'card';

    card.style.setProperty('--card-bg', color.bg);
    card.style.setProperty('--card-color', color.main);
    card.style.setProperty('--card-edge', color.edge);

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = '⌖';

    const title = document.createElement('button');
    title.className = 'cardTitle';
    title.textContent = item.name;

    title.onclick = () => {
      current = item.id;
      $('editTitle').textContent = item.name;
      $('editDialog').showModal();
    };

    const count = document.createElement('small');
    count.textContent = shops(item).length + 'টি দোকান';

    const row = document.createElement('div');
    row.className = 'row';

    const mapButton = document.createElement('button');
    mapButton.className = 'btn primary';
    mapButton.textContent = 'Open Location';
    mapButton.onclick = () => openMap(item.id);

    const listButton = document.createElement('button');
    listButton.className = 'btn';
    listButton.textContent = 'Shop List';
    listButton.onclick = () => openList(item.id);

    row.append(mapButton, listButton);
    card.append(badge, title, count, row);
    $('cards').append(card);
  });

  if (!$('cards').children.length && ready) {
    $('cards').innerHTML =
      '<div class="empty">' +
      (query ? 'পাওয়া যায়নি' : 'কোনো SR নেই') +
      '</div>';
  }
}

function renderMap() {
  mapLayer.clearLayers();

  if (!sr() || drawing) return;

  const index = srs().findIndex(item => item.id === current);
  const color = colors[Math.max(0, index) % colors.length];
  const vertices = ring(sr());

  if (vertices.length) {
    L.polygon(vertices, {
      color: color.main,
      weight: 3,
      fillOpacity: .025,
      dashArray: '9 6',
      interactive: false
    }).addTo(mapLayer);
  }

  shops(sr()).forEach(shop => {
    const marker = L.marker(
      [shop.lat, shop.lng],
      {
        icon: L.divIcon({
          className: 'pin',
          html:
            `<span style="background:${color.main}">` +
            `<b>${Number(shop.srSerial) || '•'}</b></span>`,
          iconSize: [32, 38],
          iconAnchor: [16, 36]
        })
      }
    ).addTo(mapLayer);

    marker.bindTooltip(esc(shop.name), {
      permanent: map.getZoom() >= 16,
      direction: 'right',
      offset: [12, -20],
      className: 'shopLabel'
    });

    marker.on('click', () => viewShop(shop.id));
  });

  $('mapTitle').textContent = sr().name;
  $('mapSub').textContent = shops(sr()).length + 'টি দোকান';
}

map.on('zoomend', () => {
  if (mode === 'map' && !drawing) renderMap();
});

function clearRoute() {
  routeController?.abort();
  routeController = null;

  if (route) {
    map.removeLayer(route);
    route = null;
  }
}

function stopGPS() {
  if (watch !== null) navigator.geolocation?.clearWatch(watch);

  watch = null;
  myPos = null;
  centerNext = false;

  if (myMarker) map.removeLayer(myMarker);
  if (accuracy) map.removeLayer(accuracy);

  myMarker = null;
  accuracy = null;
}

function gps(center = true) {
  if (!navigator.geolocation || !isSecureContext) {
    toast('লোকেশনের জন্য HTTPS প্রয়োজন।');
    return;
  }

  centerNext = center;

  if (watch !== null) {
    if (center && myPos) {
      map.setView(myPos, 17);
      centerNext = false;
    }
    return;
  }

  watch = navigator.geolocation.watchPosition(
    position => {
      myPos = [
        position.coords.latitude,
        position.coords.longitude
      ];

      const radius = Math.min(position.coords.accuracy, 2000);

      if (myMarker) {
        myMarker.setLatLng(myPos);
        accuracy.setLatLng(myPos).setRadius(radius);
      } else {
        accuracy = L.circle(myPos, {
          radius,
          weight: 0,
          fillColor: '#268bf4',
          fillOpacity: .08,
          interactive: false
        }).addTo(map);

        myMarker = L.circleMarker(myPos, {
          radius: 8,
          color: '#fff',
          weight: 3,
          fillColor: '#237cf4',
          fillOpacity: 1
        }).addTo(map).bindTooltip('আপনার লোকেশন');
      }

      if (centerNext) {
        map.setView(myPos, 17);
        centerNext = false;
      }
    },
    error => {
      stopGPS();
      toast(
        error.code === 1
          ? 'লোকেশন অনুমতি দিন।'
          : 'লোকেশন পাওয়া যায়নি।'
      );
    },
    {
      enableHighAccuracy: true,
      maximumAge: 3000,
      timeout: 15000
    }
  );
}

function openMap(key, shopId = null) {
  current = key;
  if (!sr()) return;

  selected = null;
  shownShop = null;
  clearRoute();
  $('sheet').hidden = true;

  show('map');
  renderMap();

  requestAnimationFrame(() => {
    map.invalidateSize();
    if (shopId) viewShop(shopId);
    else fit();
  });

  gps(false);
}

function openList(key) {
  current = key;
  if (!sr()) return;

  stopGPS();
  clearRoute();
  $('sheet').hidden = true;
  shownShop = null;
  $('shopSearch').value = '';

  show('list');
  renderList();
}

function renderList() {
  if (!sr()) return;

  $('listTitle').textContent = sr().name;
  const query = $('shopSearch').value.trim().toLowerCase();

  $('shopList').replaceChildren();

  shops(sr())
    .sort((a, b) => a.srSerial - b.srSerial)
    .filter(shop =>
      [shop.name, shop.owner, shop.phone].some(value =>
        String(value).toLowerCase().includes(query)
      )
    )
    .forEach(shop => {
      const card = document.createElement('article');
      card.className = 'shopRow';

      if (shop.photo?.startsWith('data:image/')) {
        const image = document.createElement('img');
        image.src = shop.photo;
        image.alt = shop.name;
        card.append(image);
      }

      const info = document.createElement('div');
      info.className = 'info';

      info.innerHTML =
        `<span class="serial">সাইট #${Number(shop.globalSerial)}` +
        ` · SR #${Number(shop.srSerial)}</span>` +
        `<strong>${esc(shop.name)}</strong>` +
        `<small>${esc(shop.owner)} · ${esc(shop.phone)}</small>`;

      const button = document.createElement('button');
      button.className = 'btn';
      button.textContent = 'View';
      button.onclick = () => openMap(current, shop.id);

      card.append(info, button);
      $('shopList').append(card);
    });

  if (!$('shopList').children.length) {
    $('shopList').innerHTML =
      '<div class="empty">কোনো দোকান নেই</div>';
  }
}

function viewShop(key, recenter = true) {
  const shop = sr()?.shops?.[key];
  if (!shop) return;

  shownShop = key;

  if (recenter) {
    map.setView(
      [shop.lat, shop.lng],
      Math.max(17, map.getZoom())
    );
  }

  const sheet = $('sheet');

  sheet.innerHTML =
    '<div class="sheetHead"><div>' +
    `<span class="serial">সাইট #${Number(shop.globalSerial)}` +
    ` · SR #${Number(shop.srSerial)}</span>` +
    `<h2>${esc(shop.name)}</h2>` +
    `<p>${esc(shop.owner)}</p>` +
    '</div>' +
    '<button id="closeSheet" class="icon" aria-label="বন্ধ">×</button>' +
    '</div>';

  if (shop.photo?.startsWith('data:image/')) {
    const image = document.createElement('img');
    image.src = shop.photo;
    image.alt = shop.name;
    sheet.append(image);
  }

  const phone = document.createElement('p');
  phone.textContent = shop.phone;
  sheet.append(phone);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const destination = document.createElement('button');
  destination.className = 'btn primary';
  destination.textContent = 'Destination';
  destination.onclick = () => directions(shop);

  const google = document.createElement('a');
  google.className = 'btn';
  google.textContent = 'Google Maps';
  google.href =
    'https://www.google.com/maps/dir/?api=1&destination=' +
    encodeURIComponent(shop.lat + ',' + shop.lng) +
    '&travelmode=driving&dir_action=navigate';
  google.target = '_blank';
  google.rel = 'noopener';

  const call = document.createElement('a');
  call.className = 'btn';
  call.textContent = 'Call';
  call.href = 'tel:' + shop.phone.replace(/[^+\d]/g, '');

  const remove = document.createElement('button');
  remove.className = 'btn danger';
  remove.textContent = 'মুছুন';
  remove.dataset.write = '';

  const srId = current;

  remove.onclick = async () => {
    if (!confirm('দোকানটি মুছবেন?')) return;

    try {
      await mutate(data => {
        if (data.srs[srId]?.shops) {
          delete data.srs[srId].shops[key];
        }
      });

      shownShop = null;
      sheet.hidden = true;
      clearRoute();
    } catch (error) {
      toast(errorText(error));
    }
  };

  actions.append(destination, google, call, remove);
  sheet.append(actions);
  sheet.hidden = false;

  $('closeSheet').onclick = () => {
    sheet.hidden = true;
    shownShop = null;
  };

  syncStatus();
}

async function directions(shop) {
  if (!myPos) {
    gps(true);
    toast('লোকেশন পাওয়া গেলে আবার চাপুন।');
    return;
  }

  clearRoute();

  const controller = new AbortController();
  routeController = controller;
  const timer = setTimeout(() => controller.abort(), 15000);

  try {
    const response = await fetch(
      'https://router.project-osrm.org/route/v1/driving/' +
      `${myPos[1]},${myPos[0]};${shop.lng},${shop.lat}` +
      '?overview=full&geometries=geojson',
      {signal: controller.signal}
    );

    const result = await response.json();

    if (
      !response.ok ||
      result.code !== 'Ok' ||
      !result.routes?.length
    ) throw Error('No route');

    if (
      routeController !== controller ||
      mode !== 'map' ||
      drawing
    ) return;

    const path = result.routes[0];

    route = L.polyline(
      path.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
      {weight: 6, color: '#237cf4'}
    ).addTo(map);

    $('sheet').hidden = true;
    shownShop = null;

    map.fitBounds(route.getBounds(), {
      paddingTopLeft: [45, 100],
      paddingBottomRight: [45, 100]
    });

    toast(
      (path.distance / 1000).toFixed(1) +
      ' কিমি · ' +
      Math.round(path.duration / 60) +
      ' মিনিট'
    );
  } catch {
    if (routeController === controller) {
      toast('Google Maps ব্যবহার করুন।');
    }
  } finally {
    clearTimeout(timer);
  }
}

function renderAll() {
  renderCards();

  if (current && !sr() && !drawing) {
    stopGPS();
    clearRoute();
    show('home');
    current = null;
    shownShop = null;
    $('sheet').hidden = true;
  }

  if (mode === 'list') renderList();

  if (mode === 'map' && !drawing) {
    renderMap();

    if (shownShop) {
      if (sr()?.shops?.[shownShop]) {
        viewShop(shownShop, false);
      } else {
        $('sheet').hidden = true;
        shownShop = null;
        clearRoute();
      }
    }
  }
}

function setZoom(on) {
  zooming = on;
  addingCorner = false;

  $('zoomToggle').textContent =
    'জুম / সরান: ' + (on ? 'চালু' : 'বন্ধ');

  $('zoomToggle').classList.toggle('selected', on);
  $('addCorner').disabled = on;
  $('removeCorner').disabled = on;

  [
    'dragging',
    'touchZoom',
    'doubleClickZoom',
    'scrollWheelZoom',
    'boxZoom',
    'keyboard'
  ].forEach(key => {
    map[key]?.[on ? 'enable' : 'disable']();
  });

  handles.forEach(handle => {
    handle.dragging[on ? 'disable' : 'enable']();
  });
}

function renderDrawing() {
  drawLayer.clearLayers();
  handles = [];
  areaPoly = null;

  if (!points.length) return;

  areaPoly = L.polyline(
    points.length > 2 ? [...points, points[0]] : points,
    {
      color: '#f16b38',
      weight: 4,
      interactive: false
    }
  ).addTo(drawLayer);

  points.forEach((point, index) => {
    const handle = L.marker(point, {
      draggable: !zooming,
      autoPan: true,
      bubblingMouseEvents: false,
      icon: L.divIcon({
        className:
          'vertex' + (index === selectedCorner ? ' active' : ''),
        iconSize: [25, 25],
        iconAnchor: [12, 12]
      })
    }).addTo(drawLayer);

    handle.on('drag', () => {
      const location = handle.getLatLng();

      points[index] = [location.lat, location.lng];

      areaPoly.setLatLngs(
        points.length > 2 ? [...points, points[0]] : points
      );
    });

    handle.on('dragend', renderDrawing);

    handle.on('click', () => {
      if (zooming) return;
      selectedCorner = index;
      renderDrawing();
    });

    handles.push(handle);
  });
}

function startArea(name, existing = null) {
  stopGPS();
  clearRoute();

  drawing = true;
  editingArea = existing
    ? {id: existing.id, polygon: clone(ring(existing))}
    : null;

  pendingName = name;
  points = existing ? clone(ring(existing)) : [];
  selectedCorner = -1;
  selected = null;
  shownShop = null;

  map.closePopup();
  mapLayer.clearLayers();

  $('sheet').hidden = true;
  $('bottom').hidden = true;
  $('menu').hidden = true;
  $('locate').hidden = true;
  $('drawbar').hidden = false;

  $('mapTitle').textContent = name;
  $('mapSub').textContent = '';

  show('map');
  renderDrawing();
  setZoom(false);

  requestAnimationFrame(() => {
    map.invalidateSize();
    fit();
  });
}

function endArea() {
  drawing = false;
  editingArea = null;
  points = [];
  selectedCorner = -1;
  addingCorner = false;

  drawLayer.clearLayers();

  $('bottom').hidden = false;
  $('menu').hidden = false;
  $('locate').hidden = false;
  $('drawbar').hidden = true;

  [
    'dragging',
    'touchZoom',
    'doubleClickZoom',
    'scrollWheelZoom',
    'boxZoom',
    'keyboard'
  ].forEach(key => map[key]?.enable());
}

$('zoomToggle').onclick = () => setZoom(!zooming);

$('addCorner').onclick = () => {
  if (zooming || busy) return;

  addingCorner = true;
  selectedCorner = -1;
  renderDrawing();

  toast('ম্যাপে কোণার জায়গায় ট্যাপ করুন।');
};

$('removeCorner').onclick = () => {
  if (zooming || busy) return;

  if (selectedCorner < 0) {
    toast('একটি কোণা নির্বাচন করুন।');
    return;
  }

  points.splice(selectedCorner, 1);
  selectedCorner = -1;
  renderDrawing();
};

$('saveArea').onclick = async () => {
  if (!validRing(points) || selfCross(points)) {
    toast('অন্তত ৩টি কোণা দিয়ে সঠিক সীমানা তৈরি করুন।');
    return;
  }

  const polygon = clone(points);
  const edit = editingArea;
  const key = edit?.id || id();
  const name = pendingName;
  const createdAt = Date.now();

  try {
    await mutate(data => {
      if (edit) {
        const item = data.srs[key];

        if (!item) throw Error('SR পাওয়া যায়নি।');

        if (
          JSON.stringify(ring(item)) !==
          JSON.stringify(edit.polygon)
        ) {
          throw Error('সীমানা বদলেছে। আবার খুলুন।');
        }

        item.polygon = polygon;
      } else {
        data.srs[key] = {
          id: key,
          name,
          polygon,
          createdAt,
          nextLocal: 1,
          shops: {}
        };
      }
    });

    endArea();
    openMap(key);
  } catch (error) {
    toast(errorText(error));
  }
};

$('cancelArea').onclick = () => {
  if (busy) return;

  const key = editingArea?.id;
  endArea();

  if (key && state.srs[key]) {
    openMap(key);
  } else {
    show('home');
    renderCards();
  }
};

map.on('click', event => {
  if (drawing) {
    if (!zooming && addingCorner && !busy) {
      points.push([event.latlng.lat, event.latlng.lng]);
      addingCorner = false;
      selectedCorner = points.length - 1;
      renderDrawing();
    }
    return;
  }

  if (mode !== 'map' || !sr()) return;

  selected = event.latlng;

  if (!inside(selected, sr())) {
    selected = null;
    toast('SR এলাকার ভেতরে ট্যাপ করুন।');
    return;
  }

  const button = document.createElement('button');
  button.className = 'btn primary';
  button.textContent = '+ দোকান';
  button.onclick = openShopForm;

  L.popup()
    .setLatLng(selected)
    .setContent(button)
    .openOn(map);
});

function openShopForm() {
  if (
    !selected &&
    myPos &&
    inside({lat: myPos[0], lng: myPos[1]}, sr())
  ) {
    selected = L.latLng(myPos);
  }

  if (!selected || !inside(selected, sr())) {
    toast('ম্যাপে দোকানের জায়গায় ট্যাপ করুন।');
    return;
  }

  if (!ready || !connected || !allowed) {
    toast('সংযোগ পরীক্ষা করুন।');
    return;
  }

  map.closePopup();
  $('shopForm').reset();
  $('shopError').textContent = '';
  $('shopDialog').showModal();
}

async function photoData(file) {
  if (!file) return '';

  if (file.size > 20 * 1024 * 1024) {
    throw Error('ছবিটি ২০ MB-এর নিচে দিন।');
  }

  return new Promise((resolve, reject) => {
    const image = new Image();
    const url = URL.createObjectURL(file);

    image.onload = () => {
      try {
        const scale = Math.min(
          1,
          640 / Math.max(image.width, image.height)
        );

        const canvas = document.createElement('canvas');

        canvas.width = Math.max(
          1,
          Math.round(image.width * scale)
        );

        canvas.height = Math.max(
          1,
          Math.round(image.height * scale)
        );

        const context = canvas.getContext('2d');
        context.fillStyle = 'white';
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.drawImage(
          image, 0, 0, canvas.width, canvas.height
        );

        resolve(canvas.toDataURL('image/jpeg', .68));
      } catch {
        reject(Error('ছবিটি পড়া যায়নি।'));
      } finally {
        URL.revokeObjectURL(url);
      }
    };

    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(Error('JPG বা PNG ছবি ব্যবহার করুন।'));
    };

    image.src = url;
  });
}

$('shopForm').onsubmit = async event => {
  event.preventDefault();
  if (preparingShop || busy) return;

  const srId = current;
  const position = selected
    ? {lat: selected.lat, lng: selected.lng}
    : null;

  const name = $('shopName').value.trim();
  const owner = $('owner').value.trim();
  const phone = $('phone').value.trim();
  const file = $('photo').files[0];

  if (!name || !owner || !phone) {
    $('shopError').textContent = 'সব ঘর পূরণ করুন।';
    return;
  }

  if (!position) return;

  preparingShop = true;
  syncStatus();

  try {
    const photo = await photoData(file);
    const key = id();

    await mutate(data => {
      const item = data.srs[srId];

      if (!item || !inside(position, item)) {
        throw Error('দোকানের অবস্থান এলাকার বাইরে।');
      }

      item.shops ||= {};
      item.nextLocal = Math.max(1, Number(item.nextLocal) || 1);

      item.shops[key] = {
        id: key,
        name,
        owner,
        phone,
        ...position,
        photo,
        globalSerial: data.nextGlobal++,
        srSerial: item.nextLocal++
      };
    });

    $('shopDialog').close();
    viewShop(key);
  } catch (error) {
    $('shopError').textContent = errorText(error);
  } finally {
    preparingShop = false;
    syncStatus();
  }
};

$('newSR').onclick = () => {
  editingName = null;
  $('nameTitle').textContent = 'নতুন SR';
  $('nameForm').reset();
  $('nameDialog').showModal();
};

$('nameForm').onsubmit = async event => {
  event.preventDefault();

  const name = $('srName').value.trim();
  if (!name) return;

  const key = editingName;

  if (!key) {
    $('nameDialog').close();
    startArea(name);
    return;
  }

  try {
    await mutate(data => {
      if (!data.srs[key]) throw Error('SR পাওয়া যায়নি।');
      data.srs[key].name = name;
    });

    $('nameDialog').close();
    editingName = null;
  } catch (error) {
    toast(errorText(error));
  }
};

$('menu').onclick = () => {

};

$('renameSR').onclick = () => {

  $('editDialog').close();
  $('nameTitle').textContent = 'নাম পরিবর্তন';

$('fit').onclick = fit;

$('listMap').onclick = () => openMap(current);
$('listBack').onclick = () => show('home');

$('mapBack').onclick = () => {
  if (busy || preparingShop) return;

  if (drawing) endArea();

  stopGPS();
  clearRoute();
  map.closePopup();

  selected = null;
  shownShop = null;
  $('sheet').hidden = true;

  show('home');
  renderCards();
};

$('srSearch').oninput = renderCards;
$('shopSearch').oninput = renderList;

$('account').onclick = async () => {
  if (busy || preparingShop) return;

  try {
    await signOut(auth);
  } catch (error) {
    toast(errorText(error));
  }
};

let loginPending = false;

$('loginForm').onsubmit = async event => {
  event.preventDefault();
  if (loginPending) return;

  loginPending = true;
  $('loginSubmit').disabled = true;
  $('loginError').textContent = '';

  try {
    await signInWithEmailAndPassword(
      auth,
      $('email').value.trim(),
      $('password').value
    );

    $('password').value = '';
  } catch (error) {
    $('loginError').textContent = errorText(error);
  } finally {
    loginPending = false;

    if (mode === 'login') {
      $('loginSubmit').disabled = false;
    }
  }
};

document.querySelectorAll('[data-close]').forEach(button => {
  button.onclick = () => {
    if (busy || preparingShop) return;
    $(button.dataset.close).close();
  };
});

document.querySelectorAll('dialog').forEach(dialog => {
  dialog.addEventListener('cancel', event => {
    if (busy || preparingShop) event.preventDefault();
  });
});

onValue(ref(db, '.info/connected'), snapshot => {
  connected = snapshot.val() === true;
  syncStatus();
});

function resetPage() {
  stopGPS();
  clearRoute();

  if (drawing) endArea();

  current = null;
  selected = null;
  shownShop = null;

  $('sheet').hidden = true;

  mapLayer.clearLayers();
  drawLayer.clearLayers();
  map.closePopup();

  document.querySelectorAll('dialog').forEach(dialog => {
    if (dialog.open) dialog.close();
  });

  show('login');
}

onAuthStateChanged(auth, user => {
  unsubscribe?.();
  memberUnsubscribe?.();

  unsubscribe = null;
  memberUnsubscribe = null;

  ready = false;
  allowed = false;
  state = {srs: {}, nextGlobal: 1};

  resetPage();
  renderCards();
  syncStatus();

  if (!user) {
    $('loginSubmit').disabled = false;
    $('loginError').textContent = '';
    return;
  }

  $('loginSubmit').disabled = true;
  $('loginError').textContent = '';

  memberUnsubscribe = onValue(
    ref(db, 'atlasMembers/' + user.uid),
    snapshot => {
      allowed = snapshot.val() === true;
      unsubscribe?.();
      unsubscribe = null;
      ready = false;

      if (!allowed) {
        state = {srs: {}, nextGlobal: 1};

        resetPage();
        renderCards();
        syncStatus();

        $('loginError').textContent =
          'এই অ্যাকাউন্টের অনুমতি নেই।';

        $('loginSubmit').disabled = false;
        return;
      }

      unsubscribe = onValue(
        atlas,
        databaseSnapshot => {
          state = databaseSnapshot.val() ||
            {srs: {}, nextGlobal: 1};

          state.srs ||= {};
          ready = true;

          if (mode === 'login') show('home');

          renderAll();
          syncStatus();
        },
        error => {
          ready = false;
          state = {srs: {}, nextGlobal: 1};

          resetPage();
          renderCards();
          syncStatus();

          $('loginError').textContent = errorText(error);
          $('loginSubmit').disabled = false;
        }
      );

      syncStatus();
    },
    error => {
      allowed = false;
      ready = false;
      state = {srs: {}, nextGlobal: 1};

      resetPage();
      renderCards();
      syncStatus();

      $('loginError').textContent = errorText(error);
      $('loginSubmit').disabled = false;
    }
  );
});

renderCards();
syncStatus();
</script>

  if (
    event.message &&
    /L is not defined|Failed to fetch|Script error/.test(event.message)
  ) {

    if (message) {
      message.textContent =
        'লোড হয়নি। ইন্টারনেট পরীক্ষা করে রিফ্রেশ করুন।';
    }
  }
});
</script>
