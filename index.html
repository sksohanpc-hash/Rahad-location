<aside id="installBar" class="installBar" aria-label="অ্যাপ ইনস্টল" hidden>
  <img src="./icon-192.png" alt="">
  <strong>SR Atlas</strong>
  <button id="installApp" type="button" class="btn primary">Install App</button>
  <button id="dismissInstall" type="button" class="installClose" aria-label="বন্ধ">×</button>
</aside>
<dialog id="installGuide" class="modal installGuide">
  <h2>Install App</h2>
  <p id="installInstructions"></p>
  <footer><button id="closeInstallGuide" type="button" class="btn primary">ঠিক আছে</button></footer>
</dialog>
<script>
(() => {
  'use strict';
  const bar = document.getElementById('installBar');
  const installButton = document.getElementById('installApp');
  const guide = document.getElementById('installGuide');
  const installedKey = 'sr-atlas-pwa-installed-v1';
  const displayMode = window.matchMedia('(display-mode: standalone)');
  const fullscreenMode = window.matchMedia('(display-mode: fullscreen)');
  let deferredPrompt = null;
  let dismissed = false;
  let authenticated = false;
  let installing = false;
  let installed = false;
  let workerReady = false;
  try { installed = localStorage.getItem(installedKey) === 'yes'; } catch {}
  const standalone = () => displayMode.matches || fullscreenMode.matches || navigator.standalone === true;
  function markInstalled() {
    installed = true;
    deferredPrompt = null;
    try { localStorage.setItem(installedKey, 'yes'); } catch {}
    update();
  }
  function update() {
    const activePage = document.querySelector('#homeView.on, #listView.on, #mapView.on');
    const modalOpen = document.querySelector('dialog[open]');
    const visible = authenticated && !!activePage && !installed && !standalone() && !dismissed && !modalOpen;
    bar.hidden = !visible;
    document.body.classList.toggle('install-visible', !!visible);
    installButton.disabled = installing;
    installButton.textContent = installing ? 'অপেক্ষা করুন…' : 'Install App';
  }
  window.atlasInstallAccess = value => {
    authenticated = !!value;
    update();
  };
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredPrompt = event;
    // A new install offer also lets an uninstalled app be offered again.
    installed = false;
    try { localStorage.removeItem(installedKey); } catch {}
    update();
  });
  window.addEventListener('appinstalled', markInstalled);
  displayMode.addEventListener('change', () => {
    if (standalone()) markInstalled();
    else update();
  });
  document.getElementById('dismissInstall').onclick = () => {
    // Only this page visit is dismissed. Refreshing or reopening offers it again.
    dismissed = true;
    update();
  };
  function showGuide() {
    const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let message;
    if (ios) {
      message = 'Safari-তে এই পেজ খুলুন। Share বাটন → Add to Home Screen → Add চাপুন।';
    } else if (!window.isSecureContext) {
      message = 'https://rahad.site ঠিকানায় পেজ খুলে আবার চেষ্টা করুন।';
    } else if (!workerReady && 'serviceWorker' in navigator) {
      message = 'ইনস্টলের ফাইল এখনও প্রস্তুত হয়নি। ইন্টারনেট চালু রেখে পেজ রিফ্রেশ করুন। এরপর Chrome-এর ⋮ মেনু → Add to Home screen / Install app নির্বাচন করুন।';
    } else {
      message = 'Chrome-এর ⋮ মেনু → Add to Home screen → Install নির্বাচন করুন। অপশন না থাকলে Chrome-এ এই পেজ খুলে কিছুক্ষণ পরে আবার চেষ্টা করুন।';
    }
    document.getElementById('installInstructions').textContent = message;
    history.pushState({atlas:true, modal:'installGuide'}, '', location.href);
    guide.showModal();
    update();
  }
  installButton.onclick = async () => {
    if (installing || standalone() || installed) return;
    if (!deferredPrompt) { showGuide(); return; }
    const prompt = deferredPrompt;
    deferredPrompt = null;
    installing = true;
    update();
    try {
      // Called directly from the user's click, as required by the browser.
      await prompt.prompt();
      const choice = await prompt.userChoice;
      if (choice.outcome === 'accepted') {
        // Confirmation comes from appinstalled, not merely clicking Accept.
        document.getElementById('toast').textContent = 'ইনস্টল হচ্ছে…';
        setTimeout(() => {
          const toast = document.getElementById('toast');
          if (toast.textContent === 'ইনস্টল হচ্ছে…') toast.textContent = '';
        }, 4500);
      }
    } catch {
      if (authenticated) showGuide();
    } finally {
      installing = false;
      update();
    }
  };
  document.getElementById('closeInstallGuide').onclick = () => history.back();
  new MutationObserver(update).observe(document.getElementById('homeView'), {attributes:true, attributeFilter:['class']});
  for (const id of ['listView','mapView','loginView','loadingView']) {
    new MutationObserver(update).observe(document.getElementById(id), {attributes:true, attributeFilter:['class']});
  }
  document.querySelectorAll('dialog').forEach(dialog => {
    new MutationObserver(update).observe(dialog, {attributes:true, attributeFilter:['open']});
  });
  window.addEventListener('pageshow', update);
  if (standalone()) markInstalled();
  if ('serviceWorker' in navigator && window.isSecureContext) {
    const start = async () => {
      try {
        await navigator.serviceWorker.register('./sw.js', {scope:'./', updateViaCache:'none'});
        await navigator.serviceWorker.ready;
        workerReady = true;
        update();
      } catch (error) {
        console.warn('App installation setup unavailable:', error.message);
      }
    };
    if (document.readyState === 'complete') start();
    else window.addEventListener('load', start, {once:true});
  }
  update();
})();
</script>

$('placeForm').onsubmit=async e=>{e.preventDefault();const q=$('placeQuery').value.trim();if(!q||drawing)return;if(Date.now()-searchAt<1100)return;cancelSearch();const epoch=searchEpoch;searchAt=Date.now();$('placeSubmit').disabled=true;const cacheKey='atlas-place-'+q.toLowerCase(),cached=readStore(cacheKey);try{let results=cached;if(!results){const controller=new AbortController();searchController=controller;const timer=setTimeout(()=>controller.abort(),12000);try{const b=map.getBounds(),p=new URLSearchParams({q,format:'jsonv2',limit:'6','accept-language':'bn,en',viewbox:[b.getWest(),b.getNorth(),b.getEast(),b.getSouth()].join(',')});const r=await fetch('https://nominatim.openstreetmap.org/search?'+p,{signal:controller.signal});if(!r.ok)throw Error();results=await r.json();if(!Array.isArray(results))throw Error();writeStore(cacheKey,results)}finally{clearTimeout(timer)}}if(epoch!==searchEpoch||mode!=='map')return;const root=$('placeResults');root.replaceChildren();root.hidden=false;if(!results.length){root.innerHTML='<div class="result">পাওয়া যায়নি। অন্য নামে চেষ্টা করুন।</div>';return}results.forEach(x=>{const b=button(x.display_name,'',()=>{root.hidden=true;follow=false;headingUp=false;updateFollow();putPin([Number(x.lat),Number(x.lon)],x.display_name);map.setView(selected,17);pointSheet()});b.className='result';root.append(b)})}catch{if(epoch===searchEpoch)toast('সার্চ পাওয়া যায়নি। আবার চেষ্টা করুন।')}finally{if(epoch===searchEpoch){$('placeSubmit').disabled=false;searchController=null}}};
function setZoom(on){zooming=on;adding=false;$('zoomToggle').textContent='জুম / সরান: '+(on?'চালু':'বন্ধ');$('zoomToggle').classList.toggle('selected',on);$('addCorner').disabled=on;$('removeCorner').disabled=on;['dragging','touchZoom','touchRotate','doubleClickZoom','scrollWheelZoom','boxZoom','keyboard'].forEach(k=>map[k]?.[on?'enable':'disable']());handles.forEach(h=>h.dragging[on?'disable':'enable']())}
function renderDrawing(){drawLayer.clearLayers();handles=[];if(!points.length)return;outline=L.polyline(points.length>2?[...points,points[0]]:points,{color:'#f16b38',weight:4,interactive:false}).addTo(drawLayer);points.forEach((p,i)=>{const h=L.marker(p,{draggable:!zooming,autoPan:true,bubblingMouseEvents:false,icon:L.divIcon({className:'vertex'+(i===chosen?' active':''),iconSize:[25,25],iconAnchor:[12,12]})}).addTo(drawLayer);h.on('drag',()=>{const p=h.getLatLng();points[i]=[p.lat,p.lng];outline.setLatLngs(points.length>2?[...points,points[0]]:points)});h.on('dragend',()=>{renderDrawing();remember()});h.on('click',()=>{if(zooming)return;chosen=i;renderDrawing()});handles.push(h)})}

function openShopForm(){if(!selected&&myPos&&inside({lat:myPos[0],lng:myPos[1]},sr()))putPin(myPos);if(!selected||!inside(selected,sr())){toast('SR এলাকার ভেতরে দোকানের জায়গায় ট্যাপ করুন।');return}if(!ready||!allowed||!connected){toast('সংযোগ পরীক্ষা করুন।');return}$('shopForm').reset();$('shopError').textContent='';modal('shopDialog')}
async function photoData(file){if(!file)return '';if(file.size>20*1024*1024)throw Error('ছবিটি ২০ MB-এর নিচে দিন।');return new Promise((resolve,reject)=>{const im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{try{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.68))}catch{reject(Error('ছবিটি পড়া যায়নি।'))}finally{URL.revokeObjectURL(url)}};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('JPG বা PNG ছবি দিন।'))};im.src=url})}
$('shopForm').onsubmit=async e=>{e.preventDefault();if(preparing||busy)return;const srId=current,p=selected?{lat:selected.lat,lng:selected.lng}:null,name=$('shopName').value.trim(),owner=$('owner').value.trim(),phone=$('phone').value.trim();if(!name||!owner||!phone){$('shopError').textContent='সব ঘর পূরণ করুন।';return}if(!p)return;preparing=true;status();try{const photo=await photoData($('photo').files[0]),key=uid();await mutate(d=>{const s=d.srs[srId];if(!s||!inside(p,s))throw Error('দোকানের অবস্থান এলাকার বাইরে।');s.shops ||= {};s.nextLocal=Math.max(1,Number(s.nextLocal)||1);s.shops[key]={id:key,name,owner,phone,...p,photo,globalSerial:d.nextGlobal++,srSerial:s.nextLocal++}});preparing=false;closeDialogs();history.replaceState({atlas:true},'',urlFor('map',srId,key));viewShop(key);remember()}catch(e){$('shopError').textContent=err(e)}finally{preparing=false;status()}};

onAuthStateChanged(auth,user=>{const epoch=++authEpoch;dataOff?.();memberOff?.();dataOff=memberOff=null;ready=false;allowed=false;restored=false;sessionUser=user?.uid||null;status();if(!user){failLogin(persistenceError?'ব্রাউজারের storage চালু করে আবার লগইন করুন।':'');return}show('loading');memberOff=onValue(ref(db,'atlasMembers/'+user.uid),s=>{if(epoch!==authEpoch)return;if(s.val()!==true){dataOff?.();dataOff=null;failLogin('এই অ্যাকাউন্টের অনুমতি নেই।');return}allowed=true;if(dataOff)return;dataOff=onValue(atlas,snapshot=>{if(epoch!==authEpoch||!allowed)return;state=snapshot.val()||{srs:{},nextGlobal:1};state.srs ||= {};ready=true;if(!restored||mode==='login'){restored=true;const saved=readStore(storeKey()),target=initHistory(saved);if(target.view==='draw'&&saved?.draft){current=saved.id;startArea(saved.draft.name,null,saved.draft)}else{visit(target.view,target.id,target.shop,false);if(target.view==='map'&&saved?.id===current){requestAnimationFrame(()=>{if(saved.center)map.setView(saved.center,saved.zoom||17);bearing(saved.bearing||0);if(saved.selected&&!shownShop){putPin(saved.selected,saved.selectedName);pointSheet()}if(saved.navigation?.srId===current){startNav(saved.navigation);follow=saved.follow!==false;headingUp=saved.headingUp!==false;updateFollow()}})}}}renderAll();status()},e=>{if(epoch===authEpoch)failLogin(err(e))})},e=>{if(epoch===authEpoch)failLogin(err(e))})});
